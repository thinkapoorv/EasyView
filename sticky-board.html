<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="t_6af8212e">EasyView Notes Board</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg-dark:#020617;--text-primary:#f8fafc;--text-secondary:#94a3b8;--accent:#8b5cf6}*{box-sizing:border-box}body{margin:0;padding:0;background:var(--bg-dark);color:var(--text-primary);font-family:Inter,sans-serif;overflow-x:hidden;min-height:100vh}.ambient-mesh{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 15% 50%,rgba(99,102,241,.08) 0,transparent 50%),radial-gradient(circle at 85% 30%,rgba(168,85,247,.08) 0,transparent 50%);z-index:0;pointer-events:none}header{display:flex;justify-content:space-between;align-items:center;padding:0 48px;height:72px;background:rgba(15,23,42,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:100;box-shadow:0 4px 24px -1px rgba(0,0,0,.5)}.header-title{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#fff 0,#cbd5e1 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.header-controls{display:flex;gap:12px}button{padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:#fff;font-weight:600;font-size:13px;cursor:pointer;transition:all .25s cubic-bezier(.16, 1, .3, 1);display:flex;align-items:center;gap:8px}button.primary{background:linear-gradient(135deg,#a855f7,#6366f1);border:1px solid rgba(255,255,255,.2);box-shadow:0 8px 20px rgba(99,102,241,.3),inset 0 1px 1px rgba(255,255,255,.3)}button:hover{transform:translateY(-2px);background:rgba(255,255,255,.08);box-shadow:0 4px 12px rgba(0,0,0,.2)}button.primary:hover{box-shadow:0 12px 24px rgba(99,102,241,.4),inset 0 1px 1px rgba(255,255,255,.4);filter:brightness(1.1)}.workspace{padding:40px 48px;position:relative;z-index:10}.section-title{font-size:18px;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.9);letter-spacing:-.3px}.section-title span{font-size:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.05);padding:4px 10px;border-radius:12px;color:var(--text-secondary);font-weight:600}.masonry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;align-items:start}.board-note-card{background:rgba(30,41,59,.7);backdrop-filter:blur(12px);border-radius:16px;padding:20px;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:14px;transition:all .3s cubic-bezier(.16, 1, .3, 1);position:relative;box-shadow:0 8px 32px rgba(0,0,0,.2),inset 0 1px 1px rgba(255,255,255,.05)}.board-note-card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 20px 40px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.1);z-index:2}.note-header{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.03em;text-transform:uppercase}.note-timestamp{font-size:10px;opacity:.5;text-transform:none;letter-spacing:normal}.note-content textarea{width:100%;min-height:140px;background:0 0;border:none;color:inherit;font-family:Inter,sans-serif;font-size:14px;line-height:1.6;resize:vertical;outline:0;font-weight:500}.note-content textarea::-webkit-scrollbar{width:4px}.note-content textarea::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}.note-origin{font-size:11px;color:#94a3b8;margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:14px;border-top:1px dashed rgba(255,255,255,.1)}.note-origin span{display:flex;align-items:center;gap:6px;overflow:hidden;font-weight:500}.note-origin a{color:#38bdf8;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;transition:color .2s}.note-origin a:hover{color:#7dd3fc;text-decoration:underline}.delete-btn{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:6px;width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;color:#ef4444;opacity:0;cursor:pointer;transition:all .2s}.board-note-card:hover .delete-btn{opacity:1}.delete-btn:hover{background:#ef4444;color:#fff;transform:scale(1.1)}.ev-color-onyx{background:rgba(30,41,59,.7)!important;color:#f8fafc!important}.ev-color-pearl{background:rgba(255,255,255,.9)!important;color:#0f172a!important;box-shadow:0 8px 32px rgba(0,0,0,.1),inset 0 1px 1px #fff}.ev-color-sapphire{background:rgba(3,105,161,.8)!important;color:#f0f9ff!important}.ev-color-amethyst{background:rgba(107,33,168,.8)!important;color:#faf5ff!important}.board-note-card.ev-color-pearl .note-header,.board-note-card.ev-color-pearl .note-origin{color:rgba(15,23,42,.7);border-top-color:rgba(15,23,42,.1)}.board-note-card.ev-color-pearl .delete-btn{background:rgba(239,68,68,.1);border-color:transparent}.board-note-card.ev-color-pearl .note-content textarea::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2)}.empty-state{grid-column:1/-1;padding:40px;text-align:center;background:rgba(255,255,255,.02);border:1px dashed rgba(255,255,255,.1);border-radius:16px;color:var(--text-secondary);font-weight:500}#importFile{display:none}</style></head><body><div class="ambient-mesh"></div><header><div class="header-title"><span style="filter:drop-shadow(0 2px 8px rgba(168,85,247,.5));font-size:24px" data-i18n="t_af97e960">📌</span> EasyView Workspace</div><div class="header-controls"><input type="file" id="importFile" accept=".json, .csv"> <button id="importBtn" title="Import sticky notes from backup"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> Import</button> <button id="backupBtn" class="primary" title="Secure Export to Server (Premium)"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Export Notes <span id="exportLockBadge" style="font-size:10px;margin-left:2px" data-i18n="t_c510248f">🔒</span></button></div></header><div class="workspace"><h2 class="section-title"><span style="background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:20px" data-i18n="t_d16da0f5">🌎</span> Global Notes <span id="global-count" data-i18n="t_cfcd2084">0</span></h2><div class="masonry-grid" id="grid-global"></div><div style="height:56px"></div><h2 class="section-title"><span style="background:linear-gradient(135deg,#fbbf24,#f87171);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:20px" data-i18n="t_6df173ff">📍</span> Site-Specific Notes <span id="local-count" data-i18n="t_cfcd2084">0</span></h2><div class="masonry-grid" id="grid-local"></div></div><script src="js/sticky-board.js"></script><script src="js/i18n-helper.js"></script></body></html>
